<body class="auth-page" data-login-role="student">
  <a class="skip-link" href="#email">Skip to sign in</a>
  <main class="auth-container">
    <section class="brand-section" aria-label="MannSathi">
      <a href="index.html" class="orbit-brand" aria-label="MannSathi home"><img src="images/mannsathi-icon.svg" alt="" width="38" height="38"><span>MannSathi</span></a>
      <div class="brand-content"><img class="auth-logo" src="images/mannsathi-icon.svg" alt="MannSathi logo" width="229" height="229"><h1>MannSathi</h1></div>
    </section>
    <section class="form-section" aria-labelledby="form-title">
      <nav class="form-top" aria-label="Account navigation"><a href="index.html" class="orbit-brand mobile-brand" aria-label="MannSathi home"><img src="images/mannsathi-icon.svg" alt="" width="38" height="38"><span>MannSathi</span></a><a class="account-link" href="signup.html">Create account <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a></nav>
      <div class="login-card">
        <nav class="login-role-links" aria-label="Sign-in type"><a href="index.html" aria-current="page">Student sign in</a><a href="teacher-login.html">Teacher sign in</a></nav>
        <header class="form-heading"><h2 id="form-title">Welcome back</h2><p>Plan assignments, track focus time and see your next deadline.</p></header>
        <form id="login-form">
          <div class="form-group"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email" required></div>
          <div class="form-group">
            <div class="password-label"><label for="password">Password</label><a href="recover.html" id="forgot-password">Forgot password?</a></div>
            <div class="password-wrapper"><input type="password" id="password" placeholder="Your password" autocomplete="current-password" required><button type="button" id="toggle-password" class="toggle-password" aria-label="Show password" aria-pressed="false">Show</button></div>
          </div>
          <button type="submit" class="primary-button login-button"><span>Sign in</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
          <a id="role-login-message-link" class="role-login-message-link" href="teacher-login.html" hidden>Go to teacher sign in</a>
        </form>
        <div class="auth-divider">or</div>
        <a class="guest-button" href="app.html?guest=true">Explore as a guest</a>
        <p class="auth-legal"><a href="help.html#help-center">Help</a><a href="help.html#privacy-policy">Privacy</a><a href="help.html#terms">Terms</a></p>
      </div>
      <footer class="form-footer"><span>&copy; 2026 MannSathi</span><button type="button" class="icon-button" data-theme-toggle aria-label="Switch theme"><svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg><svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 1 1 11 3.2 7 7 0 0 0 20.8 13Z"/></svg></button></footer>
    </section>
  </main>
  <script src="js/vendor/supabase-2.119.2/supabase.js"></script>
