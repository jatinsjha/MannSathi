<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Reset password | MannSathi</title>
  <script src="js/recovery.js"></script>
  <script src="js/theme.js"></script>
  <link rel="icon" type="image/svg+xml" href="images/mannsathi-icon.svg">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="brand-section" aria-label="MannSathi">
      <div class="orbit-brand"><img src="images/mannsathi-icon.svg" alt="" width="38" height="38"><span>MannSathi</span></div>
      <div class="brand-content"><img class="auth-logo" src="images/mannsathi-icon.svg" alt="" width="229" height="229"><h1>MannSathi</h1></div>
    </section>
    <section class="form-section" aria-labelledby="recovery-title">
      <nav class="form-top" aria-label="Account navigation">
        <span class="orbit-brand mobile-brand"><img src="images/mannsathi-icon.svg" alt="" width="38" height="38">MannSathi</span>
        <a class="account-link" id="return-to-login" href="index.html">Student sign in</a>
      </nav>
      <div class="login-card">
        <header class="form-heading"><h2 id="recovery-title">Reset your password</h2><p id="recovery-detail">Checking your recovery link…</p></header>
        <button type="button" id="verify-recovery" class="primary-button login-button" hidden>Open password reset</button>
        <form id="new-password-form" hidden>
          <div class="form-group"><label for="new-password">New password</label><div class="password-wrapper">
            <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
            <button type="button" class="toggle-password" id="reveal-password" aria-label="Show passwords" aria-pressed="false">Show</button>
          </div></div>
          <div class="form-group"><label for="confirm-new-password">Confirm new password</label>
            <input id="confirm-new-password" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <button type="submit" id="save-password" class="primary-button login-button">Update password</button>
        </form>
        <form id="recovery-mfa-form" hidden>
          <div id="recovery-factor-choice" class="form-group" hidden>
            <label for="recovery-factor">Authenticator</label><select id="recovery-factor"></select>
          </div>
          <div class="form-group"><label for="recovery-code">Six-digit authenticator code</label>
            <input id="recovery-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
          </div>
          <button type="submit" id="verify-factor" class="primary-button login-button">Verify code</button>
        </form>
        <a id="recovery-factor-help" class="role-login-message-link" href="help.html#help-center" hidden>Lost your authenticator? Contact support</a>
        <form id="request-recovery-form" hidden>
          <div class="form-group"><label for="recovery-email">Account email</label>
            <input id="recovery-email" type="email" autocomplete="email" required>
          </div>
          <button type="submit" id="send-recovery" class="primary-button login-button">Send a reset link</button>
        </form>
        <p class="form-message" id="recovery-message" aria-live="polite" role="status"></p>
        <a class="role-login-message-link" id="completed-login" href="index.html?recovered=1" hidden>Continue to sign in</a>
        <noscript>Enable JavaScript to reset your MannSathi password.</noscript>
      </div>
    </section>
  </main>
  <script src="js/vendor/supabase-2.119.2/supabase.js"></script>
  <script src="js/supabase.js"></script>
</body>
</html>
